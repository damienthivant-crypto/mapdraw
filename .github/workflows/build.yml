# Compile le mod sur GitHub à chaque push : le .jar est téléchargeable
# dans l'onglet « Actions » > dernier build > « Artifacts ».
name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: mapdraw-jar
          path: build/libs/mapdraw-*.jar
      - name: publier la release « latest »
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "MapDraw – dernier build" --notes "Build automatique du commit ${GITHUB_SHA::7}. Télécharger le .jar ci-dessous et le mettre dans .minecraft/mods (et mods/ du serveur)." --target "$GITHUB_SHA"
